name: APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPECTED_CERT_SHA256: 2df9ee0657a37d319c83fbd52465ed44b9beee082f1af7562b4cc3c220db3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'
      - name: Pregătește cheia de semnare
        env:
          LSO_KEYSTORE_BASE64: ${{ secrets.LSO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$LSO_KEYSTORE_BASE64" ]; then
            echo "Lipsește secretul LSO_KEYSTORE_BASE64. Nu semnez cu o cheie aleatorie." >&2
            exit 1
          fi
          echo "$LSO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lso.keystore"
          echo "LSO_KEYSTORE=$RUNNER_TEMP/lso.keystore" >> "$GITHUB_ENV"
      - name: Dependențe și sincronizare
        run: |
          npm ci
          python3 -m pip install pillow
          python3 tools/sync-www.py
          python3 tools/make-android-icons.py
          npx cap sync android
      - name: Construiește APK (release, cheia stabilă)
        working-directory: android
        env:
          LSO_KEYSTORE_PASSWORD: ${{ secrets.LSO_KEYSTORE_PASSWORD }}
          LSO_KEY_ALIAS: ${{ secrets.LSO_KEY_ALIAS }}
          LSO_KEY_PASSWORD: ${{ secrets.LSO_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Verifică semnătura și alinierea
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | grep -F "$EXPECTED_CERT_SHA256"
      - uses: actions/upload-artifact@v4
        with:
          name: lege-si-ordine-apk
          path: android/app/build/outputs/apk/release/app-release.apk
