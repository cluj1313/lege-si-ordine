name: APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'
      - name: Dependențe și sincronizare
        run: |
          set -x
          npm install
          python3 tools/sync-www.py || echo "sync-www failed"
          python3 tools/make-android-icons.py || echo "icons failed"
          npx cap sync android
      - name: Construiește APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Pregătește artefactul
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/LEGE-SI-ORDINE-v3.apk
          ls -lh dist/LEGE-SI-ORDINE-v3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LEGE-SI-ORDINE-v3-apk
          path: dist/LEGE-SI-ORDINE-v3.apk
          if-no-files-found: error
