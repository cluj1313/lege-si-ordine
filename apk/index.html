body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;background:#0f1a2e;color:#eef0f5;text-align:center;padding:24px}

<body>
<img src="og-icon.png" alt="LEGE ȘI ORDINE">
<h1>LEGE ȘI ORDINE</h1>
<p id="ver">Versiunea 1.0.8 (v9)</p>
<a class="btn" id="dl" href="https://github.com/cluj1313/lege-si-ordine/releases/download/v1.0.8/LEGE-SI-ORDINE-v1.0.8.apk">Descarcă</a>
<small>Descărcarea pornește automat…</small>
<p class="tip">Dacă browserul spune «File might be harmful», apasă «Download anyway», apoi Deschide și Instalează.</p>
<script>
const FALLBACK = {
  name: "1.0.8",
  code: "9",
  url: "https://github.com/cluj1313/lege-si-ordine/releases/download/v1.0.8/LEGE-SI-ORDINE-v1.0.8.apk"
};
let apkUrl = FALLBACK.url;

function pickApk(assets) {
  const urls = (assets || [])
    .map(function (a) { return a && a.browser_download_url; })
    .filter(function (u) { return u && /\.apk$/i.test(u); });
  function prefer(re) {
    return urls.find(function (u) { return re.test(decodeURIComponent(u.split("/").pop())); });
  }
  return prefer(/^LEGE-SI-ORDINE-v/i) ||
         prefer(/^LEGE-SI-ORDINE\.apk$/i) ||
         prefer(/^LSO\.apk$/i) ||
         urls[0] ||
         FALLBACK.url;
}

function show(name, code, url) {
  apkUrl = url;
  document.getElementById("ver").textContent = code
    ? ("Versiunea " + name + " (v" + code + ")")
    : ("Versiunea " + name);
  document.title = "LEGE ȘI ORDINE " + name;
  document.getElementById("dl").href = url;
}

function startDownload() {
  if (!/[?&]nr\b/.test(location.search)) location.href = apkUrl;
}

show(FALLBACK.name, FALLBACK.code, FALLBACK.url);

const started = Date.now();
fetch("https://api.github.com/repos/cluj1313/lege-si-ordine/releases/latest")
  .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
  .then(function (rel) {
    const tag = String(rel.tag_name || "").replace(/^v/i, "");
    const fromName = String(rel.name || "").match(/(\d+\.\d+\.\d+)/);
    const name = (fromName && fromName[1]) || tag || FALLBACK.name;
    const url = pickApk(rel.assets);
    const ref = rel.tag_name || ("v" + name);
    return fetch("https://raw.githubusercontent.com/cluj1313/lege-si-ordine/" + encodeURIComponent(ref) + "/android/app/build.gradle")
      .then(function (r) { return r.ok ? r.text() : ""; })
      .then(function (t) {
        const code = (t.match(/versionCode\s+(\d+)/) || [])[1] || "";
        const verName = (t.match(/versionName\s+"([^"]+)"/) || [])[1] || name;
        show(verName, code, url);
      })
      .catch(function () { show(name, "", url); });
  })
  .catch(function () {})
  .then(function () {
    const wait = Math.max(0, 1000 - (Date.now() - started));
    setTimeout(startDownload, wait);
  });
</script>
